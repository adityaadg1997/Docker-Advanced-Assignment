name: Docker CI/CD

# Trigger the workflow on code push to the main branch
on:
  push:
    branches:
      - develop

# Define the workflow jobs
jobs:
  build:
    # Run on an Ubuntu virtual machine
    runs-on: ubuntu-latest

    # Steps to execute
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Step 3: Install Docker Compose (if needed)
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

# Step 5: Build Docker Image
      - name: Build Docker Image
        run: |
          docker-compose build
          # Check if the image exists after build
          docker images

      # Step 6: Tag and Push Docker Images (only if the image exists)
      - name: Tag and Push Docker Images
        run: |
          # Check if the image exists
          if docker images | grep -q "advanced-web-service"; then
            docker tag advanced-web-service:latest adityagautam1909/advanced-web-service:latest
            docker push adityagautam1909/advanced-web-service:latest
          else
            echo "Image 'advanced-web-service' not found, skipping push."
            exit 1
          fi
